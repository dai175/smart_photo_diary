name: CI/CD Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel only PR runs. On main, a version-only push must not cancel an
  # in-progress Android build that the new run would skip.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect-changes:
    name: Detect Platform Skip
    runs-on: ubuntu-latest
    outputs:
      skip_platforms: ${{ steps.detect.outputs.skip_platforms }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide skip_platforms
        id: detect
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "skip_platforms=false" >> "$GITHUB_OUTPUT"
            echo "workflow_dispatch: always run platform builds"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "skip_platforms=false" >> "$GITHUB_OUTPUT"
            echo "pull_request: platform jobs gated by event; detect unused"
            exit 0
          fi

          # push to main: compare the full pushed range, not only HEAD~1
          if [ -z "${EVENT_BEFORE:-}" ] || [ "$EVENT_BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "skip_platforms=false" >> "$GITHUB_OUTPUT"
            echo "Missing or zero before SHA: do not skip platforms"
            exit 0
          fi

          mapfile -t CHANGED < <(git diff --name-only "$EVENT_BEFORE" "$EVENT_SHA")
          if [ "${#CHANGED[@]}" -eq 0 ]; then
            echo "skip_platforms=false" >> "$GITHUB_OUTPUT"
            echo "No changed files: do not skip platforms"
            exit 0
          fi

          SKIP=true
          for f in "${CHANGED[@]}"; do
            if [[ ! "$f" =~ ^(pubspec\.yaml|CHANGELOG\.md)$ ]]; then
              SKIP=false
              break
            fi
          done

          echo "skip_platforms=${SKIP}" >> "$GITHUB_OUTPUT"
          echo "Changed files: ${CHANGED[*]}"
          echo "skip_platforms=${SKIP}"

  quality-check:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Guard against stale Gemini-direct API markers
        run: bash scripts/check_no_stale_gemini_key.sh

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze code
        run: flutter analyze --fatal-warnings --fatal-infos

      - name: Run tests
        run: flutter test --coverage --reporter=expanded

      - name: Remove generated and UI files from coverage
        run: |
          if ! command -v lcov &>/dev/null; then sudo apt-get install -y lcov; fi
          lcov --remove coverage/lcov.info \
            '**/*.g.dart' \
            '**/l10n/generated/*' \
            '**/debug/*' \
            '**/screens/**' \
            '**/widgets/**' \
            '**/ui/**' \
            '**/shared/**' \
            '**/main.dart' \
            --ignore-errors unused \
            -o coverage/lcov.info

      - name: Check coverage threshold
        run: |
          COVERAGE_LINE=$(lcov --summary coverage/lcov.info 2>&1 | grep 'lines' || true)
          COVERAGE_NUM=$(echo "$COVERAGE_LINE" | sed -n 's/.*:\s*\([0-9.]*\)%.*/\1/p' | head -1)
          COVERAGE="${COVERAGE_NUM}%"
          MIN_COVERAGE=55
          echo "Coverage: ${COVERAGE:-Unknown}"
          if [ -z "$COVERAGE_NUM" ]; then
            echo "::error::Could not parse coverage percentage"
            exit 1
          fi
          if ! awk "BEGIN { exit ($COVERAGE_NUM >= $MIN_COVERAGE ? 0 : 1) }"; then
            echo "::error::Coverage ${COVERAGE} is below threshold ${MIN_COVERAGE}%"
            exit 1
          fi
          echo "Coverage ${COVERAGE} meets threshold ${MIN_COVERAGE}%"

      - name: Report coverage summary
        if: github.event_name == 'pull_request'
        run: |
          COVERAGE=$(lcov --summary coverage/lcov.info 2>&1 | grep 'lines' | grep -oE '[0-9]+\.[0-9]+%' || true)
          echo "## Test Coverage: ${COVERAGE:-Unknown}" >> $GITHUB_STEP_SUMMARY

  build-android:
    name: Build Android
    needs: [quality-check, detect-changes]
    if: github.event_name != 'pull_request' && needs.detect-changes.outputs.skip_platforms != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          setup-java: 'true'

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Verify Android build success
        run: |
          if [ -f "build/app/outputs/bundle/release/app-release.aab" ]; then
            echo "Release AAB built successfully"
          else
            echo "::error::Release AAB not found"
            exit 1
          fi

  ci-summary:
    name: CI Summary
    needs: [quality-check, detect-changes, build-android]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Create CI summary
        env:
          ANDROID_RESULT: ${{ needs.build-android.result }}
          SKIP_PLATFORMS: ${{ needs.detect-changes.outputs.skip_platforms }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "## CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Completed Steps" >> $GITHUB_STEP_SUMMARY
          echo "- **Code Quality**: Tests, analysis, and formatting checks" >> $GITHUB_STEP_SUMMARY
          echo "- **iOS CI Build**: Not run (signed IPA is built only in ios-deploy.yml)" >> $GITHUB_STEP_SUMMARY

          if [ "$ANDROID_RESULT" = "success" ]; then
            echo "- **Android Build**: AAB compilation verified" >> $GITHUB_STEP_SUMMARY
          elif [ "$ANDROID_RESULT" = "skipped" ]; then
            if [ "$EVENT_NAME" = "pull_request" ]; then
              echo "- **Android Build**: Skipped (pull request)" >> $GITHUB_STEP_SUMMARY
            elif [ "$SKIP_PLATFORMS" = "true" ]; then
              echo "- **Android Build**: Skipped (version-only change)" >> $GITHUB_STEP_SUMMARY
            else
              echo "- **Android Build**: Skipped" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "- **Android Build**: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Notes" >> $GITHUB_STEP_SUMMARY
          echo "- CI builds create a dummy .env file for testing purposes" >> $GITHUB_STEP_SUMMARY
          echo "- Platform builds are skipped on pull requests and on version-only main pushes (pubspec.yaml / CHANGELOG.md only)" >> $GITHUB_STEP_SUMMARY
