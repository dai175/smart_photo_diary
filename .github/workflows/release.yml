name: Create Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read
  pull-requests: read

jobs:
  version:
    name: Extract Version Info
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_name: ${{ steps.version.outputs.version_name }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Verify CI passed
        uses: ./.github/actions/verify-ci

      - name: Extract version info
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION_NAME="${VERSION#v}"
          BUILD_NUMBER=$GITHUB_RUN_NUMBER

          echo "Release build - Tag: ${VERSION}, Version: ${VERSION_NAME}, Build: ${BUILD_NUMBER}"

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "build_number=${BUILD_NUMBER}" >> $GITHUB_OUTPUT

  create-release:
    name: Create GitHub Release
    needs: [version]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          VERSION_NAME: ${{ needs.version.outputs.version_name }}
          BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "$VERSION" == *"-"* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          printf "Draft release for Smart Photo Diary %s\n\n**Build Info:** %s (Build %s)\n**Commit:** %s\n\nRelease notes will be updated manually. Publishing this draft triggers ios-deploy.yml, which builds and signs the IPA." \
            "$VERSION" "$VERSION_NAME" "$BUILD_NUMBER" "$COMMIT_SHA" > release_notes.txt

          gh release create "$VERSION" \
            --title "Smart Photo Diary $VERSION" \
            --target "$COMMIT_SHA" \
            --draft \
            ${PRERELEASE_FLAG:+"$PRERELEASE_FLAG"} \
            --notes-file release_notes.txt

      - name: Create release summary
        env:
          VERSION: ${{ needs.version.outputs.version }}
          IS_PRERELEASE: ${{ contains(needs.version.outputs.version, '-') }}
          BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
        run: |
          echo "## Draft Release Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Release Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- **Build number**: $BUILD_NUMBER (GITHUB_RUN_NUMBER; reused by ios-deploy)" >> $GITHUB_STEP_SUMMARY
          echo "- **Pre-release**: $IS_PRERELEASE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Notes" >> $GITHUB_STEP_SUMMARY
          echo "- Draft only; no iOS artifacts attached" >> $GITHUB_STEP_SUMMARY
          echo "- Publish the draft to trigger signed IPA build via ios-deploy.yml" >> $GITHUB_STEP_SUMMARY
